name: Metacloud
description: >-
  Metacloud was an OpenStack-based private-cloud company founded in 2011 in
  Pasadena, California by former infrastructure engineers from Yahoo! and
  Ticketmaster. It let enterprises run production OpenStack private clouds on
  their own hardware, fully operated as a managed service. Metacloud raised a
  $10M Series A led by Canaan Partners (with Storm Ventures and AME Cloud
  Ventures) and was acquired by Cisco in 2014, where it became Cisco Metapod
  and later Cisco Metacloud before the product line was retired. There is no
  independent Metacloud company or first-party developer API surface today; the
  platform exposed standard OpenStack APIs rather than a proprietary API.
